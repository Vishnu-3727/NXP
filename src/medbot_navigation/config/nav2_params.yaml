# Local-only Nav2 controller (no map/AMCL/global planner): MPPI FollowPath +
# rolling local costmap fed by LIDAR. wander_route.py feeds it a hardcoded
# road-corridor path; MPPI's obstacle-aware trajectory sampling swerves around
# anything the LIDAR sees along the way. collision_monitor stays downstream as
# a hard safety backstop. Trimmed from nav2_bringup's params.yaml, frames
# adjusted to base_footprint (this project's moving TF frame).
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Calibrated for MPPI's real ~0.15-0.2 m/s on this rover (see project memory:
      # MPPI is legitimately slow here). The default 0.5m/10s falsely flags
      # slow-but-real progress as failure -> bt_navigator runs a spin/backup
      # recovery that UNDOES forward progress (observed: odom crept to x~5.8 then
      # got backed up to x~3.1, never converging). A tolerant window lets MPPI's
      # own forward drive carry it to the goal instead of thrashing on recoveries.
      required_movement_radius: 0.25
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4
      # Point goal (patient pickup) -- final heading is irrelevant, so don't gate
      # "goal reached" on arriving at a specific yaw (was 0.5 for the path follower).
      yaw_goal_tolerance: 3.15

    # Regulated Pure Pursuit: follows the NavFn global path to the goal and
    # ROTATES IN PLACE to face it when the heading error is large. This is the
    # fix for MPPI's failure to recover the ~85deg overshoot after NavFn's detour
    # around obstacles (see project memory / the disabled MPPI block below).
    # Obstacle avoidance = NavFn routes around them + bt_navigator replans; RPP
    # follows the path and stops (collision detection) if something is right ahead.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # rotate in place when heading error > 45deg -- the key knob for this fix
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 3.2
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

    # DISABLED -- kept for reference only (NOT in controller_plugins, so nav2
    # never loads it). MPPI could not recover the large heading error from NavFn's
    # obstacle detours; the critic/std tuning below is prior-session work.
    FollowPath_mppi_disabled:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      # wz_std raised 0.4->0.8: MPPI needs more angular exploration to recover a
      # LARGE heading error. NavFn's detour around the visual sign cluster (the gz
      # lidar sees no-collision signs at ~(0,3),(2.4,2.4)) makes a sharp dogleg;
      # the north-facing rover overshot to face east and, with weak angular
      # sampling, could not rotate the ~85deg back onto the path (stalled at ~0
      # vel in open space). The road-loop avoided this via <14deg Bezier corners.
      wz_std: 0.8
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      # Local closest-point search (~= getMaxCostmapDist, 6m local costmap /2).
      # The old 60.0 was a wander_route artifact: it resent a STATIC path from
      # odom origin every cycle, so MPPI had to relocate the robot far along a
      # fixed path. bt_navigator now sends a FRESH path rooted at the robot each
      # cycle, and NavFn's detour around the pedestrian at (0,10) can fold the
      # path back near the robot -- a 60m search then snaps MPPI to the wrong
      # (far) segment, it thinks it's locally "done", and commands ~0 velocity in
      # open space (observed: 0.01-0.06 m/s, valid 128-pose plan, nothing within
      # 1.9m). A local search follows the path segment actually ahead.
      max_robot_pose_search_dist: 3.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0   # needed for corner tracking; lowering to 7 stalled it AT the corner
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0   # 2->8: reward rotating to FACE the path when heading
                           # error is large (the dogleg overshoot), so MPPI turns
                           # back onto it instead of sitting at ~0 velocity.
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

# --- Global planning half (added for NavigateToPose goal-based nav) -----------
# The controller half above (MPPI + local_costmap) followed a hand-built path.
# These four servers turn the stack into a goal-based planner: NavFn plans a path
# around obstacles in the global_costmap, bt_navigator's default tree drives it
# and REPLANS at ~1Hz when the lidar reveals a new obstacle, behavior_server runs
# recoveries when stuck. No map/AMCL -- everything is in the EKF 'odom' frame.

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom            # no map_server/AMCL -> plan in the odom frame
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.1
      # ponytail: rolling 40x40 in odom, no map_server/AMCL. The window follows the
      # robot and is big enough for the ~16m spawn->goal. Bump size or add AMCL+map
      # only if a goal ever falls outside the window.
      rolling_window: true
      width: 40
      height: 40
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Omit default_nav_to_pose_bt_xml -> use nav2's built-in navigate-with-replanning
    # tree (ComputePathToPose on a rate + FollowPath + recovery fallback). That rate
    # loop is what re-plans around a newly-seen obstacle -- the drawing's behaviour.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # TwistStamped downstream (diff_drive controller + collision_monitor chain);
    # recovery cmd_vel is remapped to cmd_vel_raw in local_nav.launch.py.
    enable_stamped_cmd_vel: true
